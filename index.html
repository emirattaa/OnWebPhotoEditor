<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş AI Fotoğraf Editörü</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Yapay Zeka (AI) Seçim ve Segmentasyon Kütüphanesi (MediaPipe) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body>

    <header>✨ Gelişmiş AI Fotoğraf Editörü</header>

    <div class="main-container">
        <div class="sidebar">
            
            <!-- Dosya Yükleme -->
            <label class="file-label">
                📸 Yeni Fotoğraf Yükle
                <input type="file" id="upload" accept="image/*">
            </label>

            <!-- Yapay Zeka Araçları -->
            <div class="control-section ai-section">
                <div class="section-title">🤖 Yapay Zeka Araçları</div>
                <button class="btn btn-ai" id="ai-bg-remove">✨ Kişiyi Seç ve Arka Planı Sil</button>
                <div id="ai-status" class="status-text" style="display: none;"></div>
            </div>

            <hr class="divider">

            <!-- Renk ve Filtre Ayarları -->
            <div class="control-section">
                <div class="section-title">🎨 Filtreler</div>
                
                <div class="control-group">
                    <label><span>Parlaklık</span> <span id="brightness-val">100%</span></label>
                    <input type="range" id="brightness" min="0" max="200" value="100" class="filter-slider">
                </div>

                <div class="control-group">
                    <label><span>Kontrast</span> <span id="contrast-val">100%</span></label>
                    <input type="range" id="contrast" min="0" max="200" value="100" class="filter-slider">
                </div>

                <div class="control-group">
                    <label><span>Doygunluk</span> <span id="saturate-val">100%</span></label>
                    <input type="range" id="saturate" min="0" max="200" value="100" class="filter-slider">
                </div>

                <div class="control-group">
                    <label><span>Siyah Beyaz</span> <span id="grayscale-val">0%</span></label>
                    <input type="range" id="grayscale" min="0" max="100" value="0" class="filter-slider">
                </div>

                <div class="control-group">
                    <label><span>Bulanıklık</span> <span id="blur-val">0px</span></label>
                    <input type="range" id="blur" min="0" max="20" value="0" step="0.5" class="filter-slider">
                </div>
            </div>

            <!-- Temel Butonlar -->
            <div class="btn-group">
                <button class="btn btn-secondary" id="reset">Filtreleri Sıfırla</button>
                <button class="btn btn-success" id="download">⬇️ İndir (PNG)</button>
            </div>
        </div>

        <div class="editor-workspace">
            <div class="placeholder-text" id="placeholder">Düzenlemek için bir fotoğraf yükleyin</div>
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Harici JavaScript Kodumuz -->
    <script src="js/editor.js"></script>
</body>
</html>
