<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Uyumlu Çizimli Fotoğraf Editörü</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #007bff;
            --accent-hover: #0056b3;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            flex: 1;
            flex-direction: row;
            overflow: hidden;
        }

        /* Sekme (Tab) Butonları */
        .tabs {
            display: flex;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
        }

        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .panel {
            display: none;
            padding: 20px;
            flex-direction: column;
            gap: 15px;
        }

        .panel.active {
            display: flex;
        }

        .editor-workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background-color: #0a0a0a;
            position: relative;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            touch-action: none; /* Mobilde çizerken ekranın kaymasını engeller */
            cursor: crosshair;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        input[type="text"], input[type="color"] {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: white;
            outline: none;
        }
        
        input[type="color"] {
            padding: 2px;
            height: 40px;
            cursor: pointer;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            width: 100%;
        }

        .btn-secondary {
            background-color: #444;
        }

        .file-label {
            display: block;
            background-color: #28a745;
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .placeholder-text {
            color: #555;
            font-size: 1.2rem;
            position: absolute;
            pointer-events: none;
        }

        .action-row {
            display: flex;
            gap: 10px;
            padding: 0 20px 20px 20px;
        }

        /* Mobil Uyum */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse; /* Mobilde araçlar altta olsun */
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-top: 1px solid var(--border-color);
                max-height: 45vh; /* Ekranın alt yarısı araçlar */
            }
            .editor-workspace {
                height: 55vh; /* Üst yarısı fotoğraf */
            }
            .file-label {
                margin: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <span>🎨 Mobil Editör</span>
        <button class="header-btn" id="downloadBtn">İndir</button>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <label class="file-label">
                📸 Fotoğraf Yükle
                <input type="file" id="uploadInput" accept="image/*">
            </label>

            <!-- Sekmeler -->
            <div class="tabs">
                <button class="tab-btn active" data-target="panel-filter" onclick="setMode('filter')">Filtre</button>
                <button class="tab-btn" data-target="panel-draw" onclick="setMode('draw')">Çizim</button>
                <button class="tab-btn" data-target="panel-text" onclick="setMode('text')">Yazı</button>
            </div>

            <!-- Filtre Paneli -->
            <div id="panel-filter" class="panel active">
                <div class="control-group">
                    <label><span>Parlaklık</span> <span id="brightness-val">100%</span></label>
                    <input type="range" id="brightness" min="0" max="200" value="100" class="filter-slider">
                </div>
                <div class="control-group">
                    <label><span>Kontrast</span> <span id="contrast-val">100%</span></label>
                    <input type="range" id="contrast" min="0" max="200" value="100" class="filter-slider">
                </div>
                <div class="control-group">
                    <label><span>Doygunluk</span> <span id="saturate-val">100%</span></label>
                    <input type="range" id="saturate" min="0" max="200" value="100" class="filter-slider">
                </div>
            </div>

            <!-- Çizim Paneli -->
            <div id="panel-draw" class="panel">
                <div class="control-group">
                    <label>Fırça Rengi</label>
                    <input type="color" id="brushColor" value="#ff0000">
                </div>
                <div class="control-group">
                    <label><span>Fırça Boyutu</span> <span id="brushSize-val">5px</span></label>
                    <input type="range" id="brushSize" min="1" max="50" value="5">
                </div>
                <small style="color:#aaa;">* Ekrana dokunarak çizin</small>
            </div>

            <!-- Yazı Paneli -->
            <div id="panel-text" class="panel">
                <div class="control-group">
                    <label>Yazılacak Metin</label>
                    <input type="text" id="textInput" placeholder="Buraya yazın...">
                </div>
                <div class="control-group">
                    <label>Yazı Rengi</label>
                    <input type="color" id="textColor" value="#ffffff">
                </div>
                <div class="control-group">
                    <label><span>Yazı Boyutu</span> <span id="textSize-val">30px</span></label>
                    <input type="range" id="textSize" min="10" max="150" value="30">
                </div>
                <small style="color:#aaa;">* Metni yerleştirmek için fotoğrafa dokunun</small>
            </div>

            <div class="action-row">
                <button class="btn btn-secondary" id="undoBtn">↩️ Geri Al</button>
            </div>
        </div>

        <div class="editor-workspace">
            <div class="placeholder-text" id="placeholder">Fotoğraf Yükleyin</div>
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script>
        // DOM Elementleri
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        
        let baseImg = new Image();
        let imageLoaded = false;
        let currentMode = 'filter'; // filter, draw, text
        
        // Katmanlar (Çizim ve yazıları tutar)
        let layers = []; 
        let isDrawing = false;
        let currentPath = null;

        // Sekme Değiştirme Mantığı
        const tabBtns = document.querySelectorAll('.tab-btn');
        const panels = document.querySelectorAll('.panel');

        function setMode(mode) {
            currentMode = mode;
            // Arayüzü güncelle
            tabBtns.forEach(btn => {
                if(btn.dataset.target === `panel-${mode}`) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            panels.forEach(panel => {
                if(panel.id === `panel-${mode}`) panel.classList.add('active');
                else panel.classList.remove('active');
            });
        }

        // --- FOTOĞRAF YÜKLEME ---
        document.getElementById('uploadInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                baseImg.onload = function() {
                    canvas.width = baseImg.width;
                    canvas.height = baseImg.height;
                    placeholder.style.display = 'none';
                    imageLoaded = true;
                    layers = []; // Yeni fotoğrafta eski çizimleri sil
                    renderCanvas();
                };
                baseImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // --- FİLTRELER ---
        const filterSliders = document.querySelectorAll('.filter-slider');
        filterSliders.forEach(slider => {
            slider.addEventListener('input', (e) => {
                document.getElementById(`${e.target.id}-val`).innerText = `${e.target.value}%`;
                if(imageLoaded) renderCanvas();
            });
        });

        // --- DOKUNMATİK VE FARE OLAYLARI KONTROLÜ ---
        function getPos(evt) {
            const rect = canvas.getBoundingClientRect();
            // Mobil dokunma mı yoksa fare mi kontrolü
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            }

            // Canvas'ın ekrandaki boyutu ile gerçek çözünürlüğü arasındaki oranı hesapla
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // Çizim ve Yazı Ekleme Başlangıcı
        function startAction(e) {
            if (!imageLoaded || currentMode === 'filter') return;
            e.preventDefault(); // Mobilde kaymayı önle

            const pos = getPos(e);

            if (currentMode === 'draw') {
                isDrawing = true;
                currentPath = {
                    type: 'stroke',
                    color: document.getElementById('brushColor').value,
                    size: document.getElementById('brushSize').value,
                    points: [pos]
                };
                layers.push(currentPath);
            } 
            else if (currentMode === 'text') {
                const textVal = document.getElementById('textInput').value;
                if(textVal.trim() === "") {
                    alert("Lütfen önce sol taraftan eklenecek metni yazın.");
                    return;
                }
                layers.push({
                    type: 'text',
                    text: textVal,
                    x: pos.x,
                    y: pos.y,
                    color: document.getElementById('textColor').value,
                    size: document.getElementById('textSize').value
                });
                renderCanvas();
            }
        }

        // Çizim Hareketi
        function moveAction(e) {
            if (!isDrawing || currentMode !== 'draw') return;
            e.preventDefault();
            const pos = getPos(e);
            currentPath.points.push(pos);
            renderCanvas();
        }

        // Çizim Bitişi
        function endAction(e) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;
        }

        // Event Listener'ları Ekle (Hem Fare Hem Dokunmatik için)
        canvas.addEventListener('mousedown', startAction);
        canvas.addEventListener('mousemove', moveAction);
        canvas.addEventListener('mouseup', endAction);
        canvas.addEventListener('mouseleave', endAction);

        canvas.addEventListener('touchstart', startAction, { passive: false });
        canvas.addEventListener('touchmove', moveAction, { passive: false });
        canvas.addEventListener('touchend', endAction);

        // Arayüz Değer Güncellemeleri (Fırça ve Yazı Boyutu Metinleri)
        document.getElementById('brushSize').addEventListener('input', e => {
            document.getElementById('brushSize-val').innerText = `${e.target.value}px`;
        });
        document.getElementById('textSize').addEventListener('input', e => {
            document.getElementById('textSize-val').innerText = `${e.target.value}px`;
        });

        // Geri Al Butonu
        document.getElementById('undoBtn').addEventListener('click', () => {
            if(layers.length > 0) {
                layers.pop();
                renderCanvas();
            }
        });

        // --- RENDER MOTORU (Tüm işlemler burada ekrana basılır) ---
        function renderCanvas() {
            if (!imageLoaded) return;

            // 1. Tuvali Temizle
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. Filtreleri ayarla ve Orijinal Fotoğrafı Çiz
            const brightness = document.getElementById('brightness').value;
            const contrast = document.getElementById('contrast').value;
            const saturate = document.getElementById('saturate').value;
            
            ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturate}%)`;
            ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);

            // 3. Filtreleri kapat (Çizimler ve yazılar filtreden etkilenmesin diye)
            ctx.filter = 'none';

            // 4. Katmanları (Çizim ve Yazıları) üstüne ekle
            layers.forEach(layer => {
                if (layer.type === 'stroke') {
                    ctx.beginPath();
                    ctx.strokeStyle = layer.color;
                    ctx.lineWidth = layer.size;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    for (let i = 0; i < layer.points.length; i++) {
                        const pt = layer.points[i];
                        if (i === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    }
                    ctx.stroke();
                } 
                else if (layer.type === 'text') {
                    ctx.font = `bold ${layer.size}px Arial`;
                    ctx.fillStyle = layer.color;
                    ctx.textBaseline = 'middle';
                    ctx.textAlign = 'center';
                    ctx.fillText(layer.text, layer.x, layer.y);
                }
            });
        }

        // --- İNDİRME İŞLEMİ ---
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!imageLoaded) {
                alert('Lütfen önce bir fotoğraf yükleyin!');
                return;
            }
            const link = document.createElement('a');
            link.download = 'mobil_duzenleme.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        });
    </script>
</body>
</html>
